# Continuous integration: every push and pull request builds and tests the backend against a real PostgreSQL,
# and lints and builds the frontend. A red check means "don't merge".
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          # The tests use their own database, iitsm_test, exactly like docker-compose creates locally.
          POSTGRES_DB: iitsm_test
          POSTGRES_USER: iitsm
          POSTGRES_PASSWORD: iitsm_dev_password
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iitsm -d iitsm_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run tests
        # via bash: the wrapper was committed from Windows without the executable bit
        run: bash ./mvnw -B test
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/iitsm_test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
          retention-days: 7

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
