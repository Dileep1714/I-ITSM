# Same routing as the Vite dev server: one origin for the site, the REST API and the WebSocket.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # REST API -> Spring Boot. Origin is dropped, as in development, so the backend sees same-origin requests.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        client_max_body_size 12m;   # photo attachments
        proxy_read_timeout 90s;     # AI copilot answers can take a few seconds
    }

    # Real-time updates (STOMP over WebSocket)
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_read_timeout 1h;
    }

    # The service worker and the HTML must always be fresh so new versions are picked up.
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    # Hashed build assets can be cached for a long time.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

    # Single-page app: unknown paths load the app, which routes them.
    location / { try_files $uri $uri/ /index.html; }
}
