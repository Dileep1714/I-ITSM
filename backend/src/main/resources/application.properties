spring.application.name=iitsm-backend

# ----- Database --------------------------------------------------------------------------------------------------
# Defaults match docker-compose.yml for local development. Override with environment variables
# (DB_URL, DB_USERNAME, DB_PASSWORD) anywhere else. Never commit real credentials.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/iitsm}
spring.datasource.username=${DB_USERNAME:iitsm}
spring.datasource.password=${DB_PASSWORD:iitsm_dev_password}

# ----- Schema ----------------------------------------------------------------------------------------------------
# Flyway owns the schema (src/main/resources/db/migration). Hibernate only VALIDATES that every entity matches the
# tables and refuses to start if they differ, so the schema can never drift silently from the code.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# All timestamps are stored and handled in UTC; the frontend converts to local time for display.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Don't keep database sessions open while rendering responses: forces data loading to happen in the service layer.
spring.jpa.open-in-view=false

# ----- Monitoring ------------------------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
