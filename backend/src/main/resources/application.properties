spring.application.name=iitsm-backend

# ----- Database --------------------------------------------------------------------------------------------------
# Defaults match docker-compose.yml for local development. Override with environment variables
# (DB_URL, DB_USERNAME, DB_PASSWORD) anywhere else. Never commit real credentials.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/iitsm}
spring.datasource.username=${DB_USERNAME:iitsm}
spring.datasource.password=${DB_PASSWORD:iitsm_dev_password}

# ----- Schema ----------------------------------------------------------------------------------------------------
# Flyway owns the schema (src/main/resources/db/migration). Hibernate only VALIDATES that every entity matches the
# tables and refuses to start if they differ, so the schema can never drift silently from the code.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# All timestamps are stored and handled in UTC; the frontend converts to local time for display.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Don't keep database sessions open while rendering responses: forces data loading to happen in the service layer.
spring.jpa.open-in-view=false

# ----- Security --------------------------------------------------------------------------------------------------
# Signing key for login tokens (HMAC-SHA256, at least 32 characters). The default is for local development ONLY:
# set JWT_SECRET to a long random value in any shared or deployed environment.
iitsm.security.jwt-secret=${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
iitsm.security.token-lifetime=8h
# Only these email domains may self-register (comma-separated; empty = anyone). Administrators can still create
# accounts with any address.
iitsm.security.registration-domains=${REGISTRATION_DOMAINS:iitsm.example.com}
# Frontend origins allowed to call the API from a browser (Vite dev server by default).
iitsm.security.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# ----- Incident handling -----------------------------------------------------------------------------------------
iitsm.priority.default-calculator=WEIGHTED_SCORE
iitsm.assignment.default-strategy=SMART
# Assign a technician automatically as soon as an incident is classified.
iitsm.assignment.auto-assign=true

# ----- Intelligent features --------------------------------------------------------------------------------------
# Classify an incident reported without a category when the suggestion is at least this confident (0-1).
iitsm.intelligence.auto-classify=true
iitsm.intelligence.auto-classify-min-confidence=0.5
# Refuse a reporter's new incident that repeats one of their own open incidents on the same service this closely.
iitsm.intelligence.own-duplicate-threshold=0.8
# How far back root-cause correlation looks for open incidents.
iitsm.intelligence.correlation-window=24h

# ----- SLA monitoring --------------------------------------------------------------------------------------------
# Background check of every open incident: warnings, breaches, escalation, auto-assignment retries, auto-verify.
iitsm.sla.monitor-enabled=true
iitsm.sla.monitor-interval=60s

# ----- Notifications ---------------------------------------------------------------------------------------------
# Email is SIMULATED (logged + shown in the admin outbox) unless a mail server is configured, e.g. Gmail:
#   spring.mail.host=smtp.gmail.com  spring.mail.port=587  spring.mail.username=...  spring.mail.password=<app password>
#   spring.mail.properties.mail.smtp.auth=true  spring.mail.properties.mail.smtp.starttls.enable=true
iitsm.notifications.from=I-ITSM <no-reply@iitsm.example.com>

# ----- Demo data -------------------------------------------------------------------------------------------------
# Creates demo users, services, categories and SLA policies on first start (only when the database is empty).
iitsm.seed.enabled=${SEED_DEMO_DATA:true}

# ----- Monitoring ------------------------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
