# Applied to every test run (activated by the Maven Surefire configuration in pom.xml).

# Separate database, created by docker/postgres-init/01-create-test-database.sql
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/iitsm_test}

# Tests create exactly the data they need; no demo data.
iitsm.seed.enabled=false

# Tests run SLA monitor cycles explicitly, at chosen points in time.
iitsm.sla.monitor-enabled=false

# Test accounts use @test.com addresses.
iitsm.security.registration-domains=test.com

# Fixed, test-only signing key.
iitsm.security.jwt-secret=test-only-secret-key-that-is-at-least-32-bytes-long!!

# Tests never call the real AI (no network, no quota use): the copilot runs in its no-key mode.
iitsm.ai.gemini.api-key=
